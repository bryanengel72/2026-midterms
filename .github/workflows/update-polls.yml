name: Update polls

on:
  schedule:
    # Every three hours. Wikipedia editors add polls throughout the day.
    - cron: "23 */3 * * *"
    # Election week (Nov 4-10) is covered by election-watch.yml, which
    # refreshes every 15 minutes in long-running jobs.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/**"
      - "test/**"
      - ".github/workflows/update-polls.yml"

permissions:
  contents: write

concurrency:
  group: update-polls
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the parser
        run: npm test

      - name: Fetch polls from Wikipedia
        run: npm run update

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/polls.json; then
            echo "Poll data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polls.json
          git commit -m "Update poll data from Wikipedia"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
