name: Update polls and deploy

on:
  schedule:
    # Every three hours. Wikipedia editors add polls throughout the day.
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/**"
      - "test/**"
      - ".github/workflows/update-polls.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-polls
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the parser
        run: npm test

      - name: Fetch polls from Wikipedia
        run: npm run update

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/polls.json; then
            echo "Poll data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polls.json
          git commit -m "Update poll data from Wikipedia"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    # Publishes the site with GitHub Pages. One-time setup:
    # Settings > Pages > Build and deployment > Source: GitHub Actions.
    needs: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
